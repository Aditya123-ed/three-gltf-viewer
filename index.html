<!doctype html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>glTF Viewer</title>
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
	/>
	<meta name="author" content="Don McCurdy" />
	<meta name="description" content="Drag-and-drop preview tool for glTF 2.0 3D models." />
	<link rel="canonical" href="https://gltf-viewer.donmccurdy.com/" />
	<link rel="shortcut icon" href="/favicon.ico" />
	<link rel="stylesheet" href="style.css" />
	<link href="https://fonts.googleapis.com/css?family=Raleway:300,400" rel="stylesheet" />
	<script defer type="module" src="src/app.js"></script>
	<style>
		.viewer-help {
			position: fixed;
			right: max(16px, env(safe-area-inset-right));
			bottom: max(40px, env(safe-area-inset-bottom));
			z-index: 1000;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 44px;
			padding: 0 18px;
			border: 1px solid #666;
			border-radius: 6px;
			background: #303030;
			color: #fff;
			font: 600 13px/1.2 Arial, sans-serif;
			text-decoration: none;
			box-shadow: 0 2px 8px #0006;
		}
		.viewer-help:hover { background: #464646; }
		.viewer-help:focus-visible { outline: 2px solid #9cc7ff; outline-offset: 3px; }
	</style>
</head>
<body>
	<header>
		<h1><a href="/">glTF Viewer</a></h1>
	</header>
	<main class="wrap">
		<div class="dropzone">
			<div class="placeholder">
				<p>Drag glTF 2.0 file or folder here</p>
			</div>
			<div class="upload-btn">
				<input type="file" name="file-input[]" id="file-input" multiple="" />
				<label for="file-input">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="17"
						viewBox="0 0 20 17"
					>
						<path
							d="M10 0l-5.2 4.9h3.3v5.1h3.8v-5.1h3.3l-5.2-4.9zm9.3 11.5l-3.2-2.1h-2l3.4 2.6h-3.5c-.1 0-.2.1-.2.1l-.8 2.3h-6l-.8-2.2c-.1-.1-.1-.2-.2-.2h-3.6l3.4-2.6h-2l-3.2 2.1c-.4.3-.7 1-.6 1.5l.6 3.1c.1.5.7.9 1.2.9h16.3c.6 0 1.1-.4 1.3-.9l.6-3.1c.1-.5-.2-1.2-.7-1.5z"
						></path>
					</svg>
					<span>Choose file</span>
				</label>
			</div>
		</div>
		<div class="spinner"></div>
	</main>
	<a
		class="viewer-help"
		href="https://docs.google.com/document/d/1uIaHFztPGOeHDTCpOVYiGgUkhD2Nkr6UJ34ya_qV9H8/edit?usp=sharing"
		target="_blank"
		rel="noopener noreferrer"
		title="Open the help guide in a new tab"
	>Help Me</a>
</body>
